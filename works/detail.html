    <script>
      function renderWD(w) {
        // prev/next chỉ tính trên các project đang hiển thị (bỏ qua project ẩn)
        const pubList = works.filter((x) => x.published !== false);
        const idx = pubList.findIndex((x) => x.id === w.id);
        const prev = pubList[idx - 1],
          next = pubList[idx + 1];
        const cv = w.cover
          ? `<img src="${w.cover}" alt="${w.title}">`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:clamp(56px,9vw,120px);font-style:italic;color:rgba(0,0,0,.06)">${w.title.split("—")[0].trim()}</div>`;
        // Description: nếu đã là HTML (từ editor mới) dùng thẳng; nếu là text cũ thì tách đoạn theo dòng trống
        const _desc = w.description || "";
        const ps = /<(p|h2|h3|ul|ol|li|br|div|blockquote)\b/i.test(_desc)
          ? _desc
          : _desc
              .split("\n\n")
              .map(
                (p, i, arr) =>
                  `<p style="${i === arr.length - 1 ? "padding-bottom:0;" : ""}">${p}</p>`,
              )
              .join("");
        const sections = (w.sections || [])
          .map((s) => {
            if (s.type === "divider")
              return `<hr class="divider" style="margin: 0 var(--page-padding-x);">`;
            if (s.type === "image") {
              const srcs = s.images?.length ? s.images : s.src ? [s.src] : [];
              const imgs = srcs.map((src) => `
              <div style="padding: 0 var(--page-padding-x); box-sizing: border-box;">
                <img src="${src}" alt="" loading="lazy" decoding="async" style="width:100%;display:block;border-radius:var(--img-radius);background:var(--bg2);">
              </div>`).join("");
              return `<div style="display:flex;flex-direction:column;gap:24px;margin-bottom:80px;">${imgs}</div>`;
            }
            return `
            <div class="wd-section">
              <div class="wd-section-label">${s.num} — ${s.label}</div>
              <div class="wd-section-right">
                <div class="wd-section-heading">${s.heading}</div>
                <div class="wd-section-body">${s.body}</div>
              </div>
            </div>`;
          })
          .join("");
        const gallery = (w.gallery || [])
          .map(
            (src) => `
          <div style="padding: 0 var(--page-padding-x); box-sizing: border-box; margin-bottom: 56px;">
            <div style="aspect-ratio: 16/9; background: var(--bg2); border-radius: var(--img-radius); overflow: hidden;">
              <img src="${src}" loading="lazy" decoding="async" style="width: 100%; height: 100%; display: block; object-fit: cover;">
            </div>
          </div>
          `,
          )
          .join("");
        const navL = prev
          ? `<div class="wd-ni" onclick="location.href='/works/detail.html?id=${prev.id}'"><div class="dir">← Previous</div><div class="ttl">${prev.title}</div></div>`
          : `<div style="background:var(--bg2)"></div>`;
        const navR = next
          ? `<div class="wd-ni nx" onclick="location.href='/works/detail.html?id=${next.id}'"><div class="dir">Next →</div><div class="ttl">${next.title}</div></div>`
          : `<div style="background:var(--bg2)"></div>`;

        // Update page title + OG meta
        document.title = `${w.title} — Châm Thanh Thanh`;
        const _ogImg = w.cover
          ? `https://chamthanhthanh.com${w.cover}`
          : "https://chamthanhthanh.com/assets/images/thumbnail-web.png";
        const _ogDesc = (w.description || "")
          .replace(/<[^>]+>/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 160);
        const _ogUrl  = `https://chamthanhthanh.com/works/detail.html?id=${w.id}`;
        const _set = (id, attr, val) => { const el = document.getElementById(id); if (el) el.setAttribute(attr, val); };
        _set("ogUrl",   "content", _ogUrl);
        _set("ogTitle", "content", `${w.title} — Châm Thanh Thanh`);
        _set("ogDesc",  "content", _ogDesc);
        _set("ogImg",   "content", _ogImg);
        _set("twTitle", "content", `${w.title} — Châm Thanh Thanh`);
        _set("twDesc",  "content", _ogDesc);
        _set("twImg",   "content", _ogImg);

        const previewBtn = (w.link && w.showPreview !== false)
          ? `<a href="${w.link}" target="_blank" rel="noopener noreferrer"
      style="display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:13px 24px;border-radius:100px;background:var(--oli);color:#fff;text-decoration:none;transition:background .2s ease,gap .2s ease;"
      onmouseover="this.style.background='#6f8a5a';this.style.gap='12px'" onmouseout="this.style.background='var(--oli)';this.style.gap='8px'"
    ><span>View design in Figma</span><span>→</span></a>`
          : "";

        document.getElementById("wdc").innerHTML = `
    <div class="wd-hero">
      <a class="wd-back" href="/works/"><span>←</span><span>Back to Works</span></a>
      <h1 class="wd-title">${w.title}</h1>
      <div class="wd-meta">
        <div><div class="wd-ml">Client</div><div class="wd-mv">${w.client || "—"}</div></div>
        <div><div class="wd-ml">Year</div><div class="wd-mv">${w.year}</div></div>
        <div><div class="wd-ml">Services</div><div class="wd-mv">${w.tags.join("<br>")}</div></div>
        <div><div class="wd-ml">Category</div><div class="wd-mv" style="text-transform:capitalize">${w.category}</div></div>
      </div>
    </div>
    <div class="wd-cover"><div class="wd-cover-inner" style="background:${w.color || "#f0eee9"}">${cv}</div></div>
    <div class="wd-body">
      <div class="wd-body-label">Overview</div>
      <div class="wd-body-text">
  ${ps}
    ${previewBtn ? `<div style="margin-top:28px;">${previewBtn}</div>` : ""}
  </div>
    </div>
  <hr class="divider">
  ${sections}${gallery}<div style="height: 120px;"></div><div class="wd-nav">${navL}${navR}</div>`;

        setTimeout(initReveal, 80);
      }

      function initWorkDetail() {
        if (hero.resume) { const r = document.getElementById('navResume'); if (r) r.href = hero.resume; }
        const id = new URLSearchParams(window.location.search).get("id");
        const w = works.find((x) => x.id === id);
        if (w && w.published !== false) renderWD(w);
        else location.href = "/works/";
      }
      initWorkDetail();
      (window._dataReady || Promise.resolve(false)).then((fromCloud) => {
        if (fromCloud) initWorkDetail();
      }).catch(() => {});
    </script>
