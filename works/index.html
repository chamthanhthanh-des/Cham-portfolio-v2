    <script>
      let filter = "all";

      function renderWorks() {
        const cats = [
          "all",
          ...new Set(
            works
              .filter((w) => w.published !== false)
              .flatMap((w) => (w.category || "").split(","))
              .map((c) => c.trim().toLowerCase())
              .filter(Boolean),
          ),
        ];
        const f = document.getElementById("wfilters");
        if (f)
          f.innerHTML = cats
            .map(
              (c) =>
                `<button class="fbtn${c === filter ? " active" : ""}" onclick="setFilter('${c}')">${c === "all" ? "All" : c}</button>`,
            )
            .join("");
        renderGrid();
      }

      function setFilter(c) {
        filter = c;
        document
          .querySelectorAll(".fbtn")
          .forEach((b) =>
            b.classList.toggle(
              "active",
              b.textContent.toLowerCase() === c ||
                (c === "all" && b.textContent === "All"),
            ),
          );
        renderGrid();
      }

      function renderGrid() {
        const pub = works.filter((w) => w.published !== false);
        const fl =
          filter === "all"
            ? pub
            : pub.filter((w) =>
                (w.category || "")
                  .split(",")
                  .map((c) => c.trim().toLowerCase())
                  .includes(filter),
              );
        const g = document.getElementById("wgrid");
        if (!g) return;
        g.classList.toggle("has-odd", fl.length % 2 !== 0);
        g.innerHTML = fl
          .map((w, i) => {
            const th = w.cover
              ? `<img src="${w.cover}" alt="${w.title}" loading="lazy" style="width:100%;height:100%;object-fit:cover">`
              : `<div class="wgi-cover" style="background:${w.color || "#f0eee9"}">${w.title.charAt(0)}</div>`;
            return `<div class="wgi" onclick="location.href='/works/detail.html?id=${w.id}'">
      <div class="wgi-num">${String(i + 1).padStart(2, "0")}</div>
      <div class="wgi-body">
        <div class="wgi-top"><span class="wgi-yr">${w.year}</span><div class="wgi-arr">↗</div></div>
        <div class="wgi-thumb">${th}</div>
        <div class="wgi-title">${w.title}</div>
        <div class="wgi-tags">${w.tags.map((t) => `<span class="tag">${t}</span>`).join("")}</div>
      </div>
    </div>`;
          })
          .join("");
      }

      function applyResume() {
        if (hero.resume) { const r = document.getElementById('navResume'); if (r) r.href = hero.resume; }
      }
      applyResume(); renderWorks();
      (window._dataReady || Promise.resolve(false)).then((fromCloud) => {
        if (fromCloud) { applyResume(); renderWorks(); }
      }).catch(() => {});
    </script>
